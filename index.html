<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant de cours — Technologie</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F5F2EB;--surface:#FDFCF9;--surface2:#F0EDE4;--border:#DDD9CE;
    --accent:#2D6A4F;--accent2:#40916C;--accent-light:#D8F3DC;
    --text:#1A1A18;--text2:#5A5A52;--text3:#9A9A8E;
    --user-bg:#2D6A4F;--bot-bg:#FDFCF9;--radius:16px;--radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:1rem;}
  .hdr-left{display:flex;align-items:center;gap:12px;}
  .logo-dot{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .logo-dot svg{width:16px;height:16px;fill:#fff;}
  .hdr-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;}
  .hdr-sub{font-size:12px;color:var(--text3);margin-top:1px;}
  .hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .badge{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--accent2);background:var(--accent-light);color:var(--accent);white-space:nowrap;}
  .fiche-chip{font-size:11px;padding:2px 8px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);}

  /* LOADING */
  #loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text2);}
  .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ERROR */
  #error-panel{flex:1;display:none;align-items:center;justify-content:center;padding:2rem;}
  .error-card{background:var(--surface);border:1px solid #F0D9AA;border-radius:var(--radius);padding:2rem;max-width:420px;text-align:center;}
  .error-card h2{font-family:'Syne',sans-serif;font-size:16px;margin-bottom:8px;color:#7A5C00;}
  .error-card p{font-size:13px;color:var(--text2);line-height:1.6;}

  /* CHAT */
  #chat-area{display:none;flex:1;flex-direction:column;overflow:hidden;}
  #messages{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;scroll-behavior:smooth;}
  .msg{display:flex;gap:10px;max-width:82%;animation:fadeUp 0.2s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;flex-direction:row-reverse;}
  .msg.bot{align-self:flex-start;}
  .bubble{padding:11px 15px;border-radius:var(--radius);font-size:14px;line-height:1.65;max-width:100%;}
  .user .bubble{background:var(--user-bg);color:#fff;border-bottom-right-radius:4px;}
  .bot .bubble{background:var(--bot-bg);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px;}
  .bot .bubble.refused{border-color:#F0D9AA;background:#FFFBF0;color:#7A5C00;}
  .avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
  .bot .avatar{background:var(--accent);}
  .bot .avatar svg{width:14px;height:14px;fill:#fff;}
  .user .avatar{background:var(--surface2);border:1px solid var(--border);font-size:13px;}
  .typing-dot{display:inline-flex;gap:4px;padding:4px 2px;}
  .typing-dot span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:bounce 1.2s infinite;}
  .typing-dot span:nth-child(2){animation-delay:.2s;}
  .typing-dot span:nth-child(3){animation-delay:.4s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
  .welcome{text-align:center;padding:2rem 1rem;color:var(--text2);font-size:14px;line-height:1.7;}
  .welcome strong{display:block;font-family:'Syne',sans-serif;font-size:16px;color:var(--text);margin-bottom:6px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
  .chip{padding:6px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s;}
  .chip:hover{border-color:var(--accent2);color:var(--accent);background:var(--accent-light);}
  .fiches-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;}

  #input-bar{padding:1rem 1.5rem;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;flex-shrink:0;}
  #user-input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:14px;background:var(--bg);color:var(--text);resize:none;outline:none;line-height:1.5;max-height:120px;overflow-y:auto;transition:border-color .15s;margin-bottom:0;}
  #user-input:focus{border-color:var(--accent2);}
  #send-btn{width:40px;height:40px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;}
  #send-btn:hover{background:var(--accent2);}
  #send-btn:disabled{opacity:.4;cursor:not-allowed;}
  #send-btn svg{width:16px;height:16px;fill:#fff;}
  .disclaimer{text-align:center;font-size:11px;color:var(--text3);padding:0 1rem .5rem;}
  #messages::-webkit-scrollbar{width:4px;}
  #messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>

<header>
  <div class="hdr-left">
    <div class="logo-dot">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div>
      <div class="hdr-title">Assistant de cours</div>
      <div class="hdr-sub" id="hdr-sub">Chargement des fiches…</div>
    </div>
  </div>
  <div class="hdr-right" id="hdr-badges"></div>
</header>

<div id="loading">
  <div class="spinner"></div>
  <span>Chargement des fiches de cours…</span>
</div>

<div id="error-panel">
  <div class="error-card">
    <h2>⚠️ Impossible de charger les fiches</h2>
    <p id="error-msg">Vérifie que le fichier <code>fiches.json</code> est bien présent dans le dépôt GitHub.</p>
  </div>
</div>

<div id="chat-area">
  <div id="messages"></div>
  <div class="disclaimer">Les réponses sont basées uniquement sur les fiches de cours chargées.</div>
  <div id="input-bar">
    <textarea id="user-input" placeholder="Pose ta question sur le cours…" rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22 11 13 2 9l20-7z"/></svg>
    </button>
  </div>
</div>

<script>
const API_KEY = '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';
let fichesMeta = [];
let fichesB64 = [];
let conversationHistory = [];
let isLoading = false;
let systemPrompt = '';

// ── Chargement au démarrage ──────────────────────────────────────────────────
async function init() {
  try {
    // 1. Charger fiches.json
    const res = await fetch('fiches.json');
    if (!res.ok) throw new Error('fiches.json introuvable (status ' + res.status + ')');
    const meta = await res.json();
    fichesMeta = meta.fiches;

    // 2. Charger chaque PDF en base64
    const loads = fichesMeta.map(async f => {
      const r = await fetch(f.fichier);
      if (!r.ok) throw new Error('PDF introuvable : ' + f.fichier);
      const buf = await r.arrayBuffer();
      const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
      return { name: f.nom, id: f.id, b64 };
    });
    fichesB64 = await Promise.all(loads);

    // 3. Construire le prompt système
    systemPrompt = `Tu es un assistant pédagogique pour des élèves de ${meta.niveau} en Technologie.
Tu réponds UNIQUEMENT à partir des fiches de cours fournies en documents.
Si la question ne concerne pas ces fiches, réponds exactement : "Je ne peux répondre qu'aux questions sur tes fiches de cours. Reformule ta question en lien avec le cours !"
N'invente jamais d'information absente des fiches.
Réponds en français, de façon claire et adaptée au niveau collège.
Ne fais jamais les exercices à la place de l'élève : guide-le avec des questions ou des indices.
Si tu cites un élément du cours, précise de quelle fiche il provient.`;

    // 4. Mettre à jour l'interface
    document.getElementById('hdr-sub').textContent = meta.niveau + ' — Technologie';
    const badges = document.getElementById('hdr-badges');
    badges.innerHTML = `<span class="badge">${fichesB64.length} fiche${fichesB64.length > 1 ? 's' : ''} chargée${fichesB64.length > 1 ? 's' : ''}</span>`;

    document.getElementById('loading').style.display = 'none';
    const chatArea = document.getElementById('chat-area');
    chatArea.style.display = 'flex';

    // 5. Message d'accueil
    const msgs = document.getElementById('messages');
    const listFiches = fichesMeta.map(f =>
      `<span class="fiche-chip">📄 ${f.nom}</span>`
    ).join('');
    msgs.innerHTML = `<div class="welcome">
      <strong>Prêt à t'aider !</strong>
      Bonjour ! 👋 Je suis ton assistant pour réviser tes cours de technologie.<br>
      Je réponds uniquement à partir de tes fiches de cours.
      <div class="fiches-list">${listFiches}</div>
      <div class="chips">
        <span class="chip" onclick="fillInput('Peux-tu m\\'expliquer la notion principale de la fiche ?')">📖 Expliquer une notion</span>
        <span class="chip" onclick="fillInput('Quels sont les points importants à retenir ?')">✅ Points clés</span>
        <span class="chip" onclick="fillInput('Pose-moi une question pour que je révise.')">🎯 Me faire réviser</span>
      </div>
    </div>`;

    // 6. Textarea auto-resize + envoi Enter
    const input = document.getElementById('user-input');
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; });

  } catch(err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-panel').style.display = 'flex';
    document.getElementById('error-msg').textContent = err.message;
  }
}

function fillInput(text) {
  const input = document.getElementById('user-input');
  input.value = text; input.focus();
}

function addMessage(role, text, refused=false) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (role === 'bot') {
    div.innerHTML = `<div class="avatar"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
      <div class="bubble${refused?' refused':''}">${fmt(text)}</div>`;
  } else {
    div.innerHTML = `<div class="avatar">👤</div><div class="bubble">${esc(text)}</div>`;
  }
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typing';
  div.innerHTML = `<div class="avatar"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
    <div class="bubble"><div class="typing-dot"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(div); msgs.scrollTop = msgs.scrollHeight;
}
function removeTyping() { const el=document.getElementById('typing'); if(el)el.remove(); }
function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(t){ return esc(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>'); }

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = ''; input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;
  isLoading = true;

  addMessage('user', text);
  conversationHistory.push({ role:'user', content: text });
  showTyping();

  try {
    // Construire les messages : PDFs envoyés à chaque appel (contexte stateless)
    const pdfBlocks = fichesB64.map(f => ({
      type: 'document',
      source: { type:'base64', media_type:'application/pdf', data: f.b64 },
      title: f.name
    }));

    // Premier message = PDFs + question, suite = historique complet avec PDFs en tête
    const messages = [
      {
        role: 'user',
        content: [
          ...pdfBlocks,
          { type:'text', text: conversationHistory[0].content }
        ]
      },
      ...conversationHistory.slice(1).map(m => ({
        role: m.role === 'user' ? 'user' : 'assistant',
        content: m.content
      }))
    ];

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-5',
        max_tokens: 1024,
        system: systemPrompt,
        messages
      })
    });

    const data = await resp.json();
    removeTyping();

    if (!resp.ok) {
      addMessage('bot', '⚠️ Erreur API : ' + (data.error?.message || resp.status));
    } else {
      const reply = data.content[0].text;
      const refused = reply.includes("ne peux répondre qu'aux questions");
      addMessage('bot', reply, refused);
      conversationHistory.push({ role:'assistant', content: reply });
    }
  } catch(err) {
    removeTyping();
    addMessage('bot', '⚠️ Impossible de joindre l\'API. Vérifie ta connexion.');
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('user-input').focus();
}

init();
</script>
</body>
</html>
